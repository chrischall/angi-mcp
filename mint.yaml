version: 1
name: Angi
slug: angi
# BROWSER-BRIDGE MCP: it reaches its site through the user's signed-in tab
# via the fetchproxy bridge, so a registration also needs runtime fly-shared,
# bridge: true and a bridgePortEnv — registration fields this manifest has no
# schema for. state.dataDir below is required for bridge and is why it is
# declared.
summary: >-
  Angi home-services access for Claude — find pros by trade and city, read
  profiles, ratings and reviews, and see your own Angi projects and reviews
  via your signed-in browser tab.
env:
  - name: ANGI_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
  - name: ANGI_DEBUG
    required: false
    help: >-
      Set to 1 to log verbose request detail to stderr.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Content pages
    # (www.angi.com) and the signed-in account app (my.angi.com) are dialled
    # by the user's browser tab over the bridge, never by this process, so
    # they are NOT listed. The one direct dial is the taxonomy: the trade/city
    # sitemaps under https://www.angi.com/sitemap/ are fetched with plain
    # node fetch (src/client.ts getSitemap), 200 with no redirect. The apex
    # angi.com is never dialled — ORIGIN is www.
    - www.angi.com
examples:
  - prompt: >-
      Find the top-rated plumbers on Angi in Charlotte, NC. Compare their
      ratings, review counts, and years in business.
    note: Resolves the trade and city slugs, then searches pros.
  - prompt: >-
      Show me the low-rated reviews for this Angi roofer and summarize the
      common complaints and how the company responded.
    note: Reads a pro's reviews, filtered to 3 stars or below.
  - prompt: >-
      What does this Angi pro's profile say about their service area, hours,
      and the tasks they offer?
    note: Reads one pro's full public profile.
